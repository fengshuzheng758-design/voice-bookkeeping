<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- 背景圆角方形 -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- 麦克风+记账图标组合 -->
  <g transform="translate(256,230)" fill="none" stroke="url(#fg)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- 麦克风主体 -->
    <rect x="-40" y="-90" width="80" height="120" rx="40"/>
    <!-- 麦克风底座 -->
    <path d="M-70,50 Q-70,90 0,90 Q70,90 70,50"/>
    <line x1="0" y1="90" x2="0" y2="130"/>
    <line x1="-40" y1="130" x2="40" y2="130"/>
  </g>
  <!-- ¥ 符号 -->
  <text x="256" y="360" text-anchor="middle" font-family="sans-serif" font-size="80" font-weight="bold" fill="url(#fg)">¥</text>
  <!-- 声波纹 -->
  <g transform="translate(256,230)" stroke="url(#fg)" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.4">
    <path d="M-100,-20 Q-130,0 -100,20"/>
    <path d="M100,-20 Q130,0 100,20"/>
    <path d="M-120,-40 Q-160,0 -120,40"/>
    <path d="M120,-40 Q160,0 120,40"/>
  </g>
</svg>
